<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MZ Halal Grocery</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      background: #198754;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .search {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 25px;
    }

    .category {
      background: white;
      border: 1px solid #ddd;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .price {
      color: #198754;
      font-size: 20px;
      font-weight: bold;
    }

    button {
      background: #198754;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
    }

    .quantity button {
      padding: 5px 10px;
      margin: 0 5px;
    }

    .cart {
      background: white;
      padding: 15px;
      margin-top: 25px;
      border-radius: 10px;
      font-size: 18px;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
    }
  </style>
</head>

<body>

<header>
  <h1>MZ Halal Grocery</h1>
  <p>Fresh & Halal Grocery</p>
</header>

<div class="container">

  <input
    class="search"
    type="text"
    placeholder="Search groceries..."
    onkeyup="searchProducts()"
    id="searchBox"
  >

  <h2>Categories</h2>

  <div class="categories">
    <div class="category">Meat</div>
    <div class="category">Dairy</div>
    <div class="category">Rice & Grains</div>
    <div class="category">Pantry</div>
    <div class="category">Drinks</div>
    <div class="category">Snacks</div>
  </div>

  <h2>Products</h2>

  <div class="products">

    <div class="product">
      <h3>Halal Chicken</h3>
      <p>Fresh halal chicken</p>
      <p class="price">$8.99</p>
      <button onclick="addToCart('Halal Chicken', 8.99)">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <h3>Basmati Rice</h3>
      <p>Premium basmati rice</p>
      <p class="price">$12.99</p>
      <button onclick="addToCart('Basmati Rice', 12.99)">
        Add to Cart
      </button>
    </div>

    <div class="product">
      <h3>Halal Snacks</h3>
      <p>Delicious halal snacks</p>
      <p class="price">$4.99</p>
      <button onclick="addToCart('Halal Snacks', 4.99)">
        Add to Cart
      </button>
    </div>

  </div>

  <div class="cart">
    <h2>🛒 Cart</h2>

    <div id="cartItems">
      Cart is empty
    </div>

    <h3>Total: $<span id="cartTotal">0.00</span></h3>
  </div>

</div>

<script>
  let cart = [];

  function addToCart(name, price) {
    let existingItem = cart.find(function(item) {
      return item.name === name;
    });

    if (existingItem) {
      existingItem.quantity++;
    } else {
      cart.push({
        name: name,
        price: price,
        quantity: 1
      });
    }

    updateCart();
  }

  function increaseQuantity(index) {
    cart[index].quantity++;
    updateCart();
  }

  function decreaseQuantity(index) {
    cart[index].quantity--;

    if (cart[index].quantity <= 0) {
      cart.splice(index, 1);
    }

    updateCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    updateCart();
  }

  function updateCart() {
    let cartItems = document.getElementById("cartItems");
    let total = 0;

    if (cart.length === 0) {
      cartItems.innerHTML = "Cart is empty";
    } else {
      cartItems.innerHTML = "";

      cart.forEach(function(item, index) {
        let itemTotal = item.price * item.quantity;
        total += itemTotal;

        cartItems.innerHTML += `
          <div class="cart-item">
            <strong>${item.name}</strong>
            <br>
            $${item.price.toFixed(2)} × ${item.quantity}
            = $${itemTotal.toFixed(2)}

            <div class="quantity">
              <button onclick="decreaseQuantity(${index})">−</button>
              ${item.quantity}
              <button onclick="increaseQuantity(${index})">+</button>
              <button onclick="removeItem(${index})">Remove</button>
            </div>
          </div>
        `;
      });
    }

    document.getElementById("cartTotal").textContent =
      total.toFixed(2);
  }

  function searchProducts() {
    let search = document
      .getElementById("searchBox")
      .value
      .toLowerCase();

    let products = document.querySelectorAll(".product");

    products.forEach(function(product) {
      let text = product.textContent.toLowerCase();

      if (text.includes(search)) {
        product.style.display = "block";
      } else {
        product.style.display = "none";
      }
    });
  }
</script>

</body>
</html>
